name: Cloudflare Discord Worker

permissions:
  contents: write

on:
  pull_request:
    paths:
      - "cloudflare/discord-worker/**"
      - ".github/workflows/cloudflare-discord-worker.yml"
  push:
    branches:
      - feature/cloudflare-worker-port
    paths:
      - "cloudflare/discord-worker/**"
      - ".github/workflows/cloudflare-discord-worker.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/discord-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir worker-build
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-build
          path: cloudflare/discord-worker/worker-build/
          if-no-files-found: error
          retention-days: 1

      - name: Publish test deployment bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan worker-deploy-artifact
          mkdir -p dist
          cp worker-build/entry.js dist/entry.js
          git add -f dist/entry.js
          git commit -m "Build Worker bundle for test deployment"
          git push --force origin HEAD:worker-deploy-artifact
