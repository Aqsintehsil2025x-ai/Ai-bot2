name: XFA safety tests

on:
  push:
    branches: [main, feature/xfa-autonomous-agent, feature/xfa-public-platform]
  pull_request:
    branches: [main]

jobs:
  xfa-workspace-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install XFA test dependency
        run: python -m pip install "cryptography>=42.0"
      - name: Run XFA safety tests
        run: python -m unittest discover -s tests -p "test_xfa_*.py" -v
      - name: Compile XFA Python modules
        run: python -m py_compile xfa_agent/*.py
