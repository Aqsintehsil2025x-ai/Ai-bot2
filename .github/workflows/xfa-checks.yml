name: XFA checks

on:
  pull_request:
    branches:
      - main
      - feature/xfa-ai-providers
  push:
    branches:
      - main
      - feature/xfa-ai-providers
      - feature/xfa-capability-platform

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
          XFA_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          XFA_COOKIE_SECURE: "false"
        run: python -m unittest discover -s tests -v

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build dashboard
        run: npm run build
